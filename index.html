     const CT=window.CT||20*1048576,HARD=60*1048576;d.appendChild(sp);$('ow').appendChild(d);
     if(f.size>CT){if(canComp()&&f.size<1500*1048576){try{sp.textContent='compressing 0%';const r=await compressVid(f,p=>{sp.textContent='compressing '+p+'%';msg('Compressing video '+p+'% ('+MB(f.size)+' MB). Keep this page open and the screen on.')});
         if(r.size>=f.size&&f.size<=HARD){sp.textContent=MB(f.size)+' MB (kept original)'}else if(r.size>HARD){it.dup=true;sp.textContent='still too big after compressing';d.classList.add('dup')}else{it.file=r;sp.textContent=MB(f.size)+' to '+MB(r.size)+' MB'}}
         catch(err){if(f.size>HARD||String(err.message)==='toolong'){it.dup=true;sp.textContent=String(err.message)==='toolong'?'too long to compress (max 15 min)':'could not compress this video';d.classList.add('dup')}else{sp.textContent=MB(f.size)+' MB (compression failed, original kept)'}}}
       else if(f.size>HARD){it.dup=true;sp.textContent='too big ('+MB(f.size)+' MB) and this browser cannot compress, use a smaller video or Chrome';d.classList.add('dup')}else{sp.textContent=MB(f.size)+' MB (large)';big_++}}
     else sp.textContent=MB(f.size)+' MB';
     if(it.dup)dups++;paint(it);items.push(it);continue}
   else{const bm=await createImageBitmap(f);it={bm,rot:0,box:trim(bm),dup:false};const c0=render(it);
     const c1=render({bm,rot:0,box:[0,0,bm.width,bm.height]});const rv=[c0,c1].flatMap(c=>[0,1,2,3].map(r=>vecOfCanvas(c,r)));it.dup=seen.some(o=>rv.some(w=>dist(w,o)<0.2));
     if(it.dup){dups++;d.classList.add('dup');const sp=document.createElement('span');sp.textContent='already in gallery';d.appendChild(sp)}else{seen.push(vecOfCanvas(c0,0));d.onclick=()=>{it.rot=(it.rot+1)%4;paint(it)}}
     it.cv=cv;it.el=d;paint(it)}
   $('ow').appendChild(d);items.push(it)}catch(err){}}
 const n=items.filter(i=>!i.dup).length;msg(n+' new'+(dups?', '+dups+' skipped':'')+(big_?'. Large videos upload slowly, keep this page open':'')+'. Tap a sideways photo to rotate it, then Upload.');$('oup').style.display=n?'':'none'};
const toB64=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)};
async function put(path,content,text,sha){for(let a=0;a<3;a++){let r;try{r=await fetch(API+path,{method:'PUT',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({message:text,content,branch:'main',...(sha?{sha}:{})})})}catch(err){await new Promise(z=>setTimeout(z,1500));continue}
 if(r.ok)return r.json();if(r.status===401||r.status===403||r.status===404)throw new Error('Token was rejected by GitHub ('+r.status+')');if(r.status===422)throw new Error('File already exists: '+path);if(r.status===413)throw new Error('File too large for GitHub');await new Promise(z=>setTimeout(z,1500))}throw new Error('Upload failed for '+path)}
async function shaOf(path){const g=await fetch(API+path+'?ref=main&t='+Date.now(),{headers:H()});if(g.ok)return (await g.json()).sha;if(g.status===404)return undefined;throw new Error('Could not read '+path+' ('+g.status+')')}
const manOf=list=>({v:2,next:NEXT,items:list.map(e=>({f:e.f,t:e.t,...(e.p?{p:e.p}:{}),...(e.m?{m:e.m}:{})}))});
async function saveMan(list,text){const sha=await shaOf('manifest.json');await put('manifest.json',btoa(JSON.stringify(manOf(list))),text,sha)}
async function encJson(blob){const buf=new Uint8Array(await blob.arrayBuffer());const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},K,buf));return btoa(JSON.stringify({iv:toB64(iv),d:toB64(ct)}))}
$('oup').onclick=async()=>{const todo=items.filter(i=>!i.dup);if(!todo.length||!K)return;$('oup').style.display='none';let done=0,error=null;
 try{for(const it of todo){const id=NEXT;msg('Uploading '+(done+1)+' of '+todo.length+(it.vid?' (video, '+MB(it.file.size)+' MB, please wait)':'')+'...');let ent,url;
   if(!it.vid){const blob=await new Promise(r=>render(it).toBlob(r,'image/jpeg',.8));await put('d-'+id+'.json',await encJson(blob),'Add photo '+id);ent={f:'d-'+id+'.json',t:'i'};url=URL.createObjectURL(blob)}
   else{const bytes=new Uint8Array(await it.file.arrayBuffer());const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},K,bytes));const out=new Uint8Array(12+ct.length);out.set(iv,0);out.set(ct,12);
     const mime=it.file.type||(/\.mov$/i.test(it.file.name)?'video/quicktime':'video/mp4');await put('d-'+id+'.bin',toB64(out),'Add video '+id);ent={f:'d-'+id+'.bin',t:'v',m:mime};
     if(it.poster){const pb=await new Promise(r=>it.poster.toBlob(r,'image/jpeg',.8));await put('d-'+id+'p.json',await encJson(pb),'Add video poster '+id);ent.p='d-'+id+'p.json';url=URL.createObjectURL(pb)}}
   NEXT=id+1;addTile(ent,url);done++;it.el.remove()}}
 catch(err){error=err}
 try{if(done)await saveMan(ents,'Update gallery list');}catch(err){error=error||err}
 vecs=null;items=items.filter(i=>i.dup);
 if(error){msg((error.message||'Something went wrong')+'. '+done+' uploaded before the error; try again to add the rest.');$('oup').style.display=''}
 else msg('Done! '+done+' added. They show up for everyone in a few minutes.')};
// ---- delete mode ----
function selUpd(){$('seln').textContent=sel.size+' selected'}
window.toggleSel=c=>{if(sel.has(c)){sel.delete(c);c.classList.remove('selx')}else{sel.add(c);c.classList.add('selx')}selUpd()};
function exitSel(){selMode=false;sel.forEach(c=>c.classList.remove('selx'));sel.clear();$('selbar').style.display='none'}
$('odel').onclick=()=>{$('own').classList.remove('on');selMode=true;sel.clear();selUpd();$('selbar').style.display='flex'};
$('selc').onclick=exitSel;
const sleep=ms=>new Promise(z=>setTimeout(z,ms));
async function removeTiles(chosen,say){const idx=chosen.map(c=>tiles.indexOf(c)).filter(i=>i>=0);if(!idx.length)return{ok:true,failed:0};const gone=new Set(idx);const rest=ents.filter((e,i)=>!gone.has(i));const files=[];idx.forEach(i=>{files.push(ents[i].f);if(ents[i].p)files.push(ents[i].p)});
 say('Updating the list...');
 try{await saveMan(rest,'Remove '+idx.length+' items from list')}catch(err){say((err.message||'Failed')+'. Nothing was deleted.');return{ok:false}}
 idx.sort((a,b)=>b-a).forEach(i=>{tiles[i].remove();if(urls[i])URL.revokeObjectURL(urls[i]);tiles.splice(i,1);urls.splice(i,1);ents.splice(i,1)});sel.clear();vecs=null;
 let failed=0,k=0;for(const f of files){k++;say('Deleting files '+k+' / '+files.length+'...');try{const sha=await shaOf(f);if(sha){const r=await fetch(API+f,{method:'DELETE',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({message:'Delete '+f,sha,branch:'main'})});if(!r.ok)failed++}}catch(err){failed++}await sleep(200)}
 return{ok:true,failed}}
$('seld').onclick=async()=>{if(!sel.size||!tok())return;const n=sel.size;if(!confirm('Delete '+n+' item(s) from the gallery for good?'))return;
 $('seld').disabled=true;const r=await removeTiles([...sel],t=>$('seln').textContent=t);$('seld').disabled=false;if(!r.ok)return;exitSel();$('om').textContent='';alert(r.failed?('Removed from the gallery. '+r.failed+' file(s) could not be deleted from the repo, but they are not shown anymore.'):'Deleted. Others see it after the site refreshes in a few minutes.')};
$('odall').onclick=async()=>{if(!tok()||!tiles.length)return;const a=prompt('This deletes ALL '+tiles.length+' photos and videos from the gallery. Type DELETE to continue.');if(a!=='DELETE'){msg('Cancelled');return}
 $('odall').disabled=true;const r=await removeTiles([...tiles],msg);$('odall').disabled=false;if(r.ok)msg(r.failed?'Gallery emptied. '+r.failed+' file(s) could not be deleted from the repo but are not shown.':'Gallery emptied.')};
// ---- find duplicates ----
const DUPT=0.15;let dupExtra=[];
function imgInfo(u){return new Promise(res=>{const im=new Image();im.onload=()=>res({im,px:im.naturalWidth*im.naturalHeight});im.onerror=()=>res(null);im.src=u})}
$('odup').onclick=async()=>{if(!tok()&&!K)return;msg('Scanning '+tiles.length+' items...');$('dupl').innerHTML='';$('dupgo').style.display='none';
 const inf=await Promise.all(urls.map((u,i)=>ents[i].t==='i'&&u?imgInfo(u):null));
 const R=inf.map(o=>o?[0,1,2,3].map(r=>vecOfCanvas(o.im,r)):null);const par=inf.map((_,i)=>i);const f=i=>par[i]===i?i:(par[i]=f(par[i]));
 for(let i=0;i<R.length;i++){if(!R[i])continue;for(let j=i+1;j<R.length;j++){if(!R[j])continue;if(R[i].some(v=>dist(v,R[j][0])<DUPT))par[f(j)]=f(i)}}
 const groups={};inf.forEach((o,i)=>{if(o){(groups[f(i)]=groups[f(i)]||[]).push(i)}});const gl=Object.values(groups).filter(g=>g.length>1);
 dupExtra=[];
 gl.forEach(g=>{g.sort((a,b)=>(inf[b].px-inf[a].px)||(a-b));const row=document.createElement('div');row.className='dg';g.forEach((i,k)=>{const d=document.createElement('div');d.className='di'+(k?' del':' keep');const im=document.createElement('img');im.src=urls[i];d.appendChild(im);const sp=document.createElement('span');sp.textContent=k?'delete':'keep';d.appendChild(sp);row.appendChild(d);if(k)dupExtra.push(tiles[i])});$('dupl').appendChild(row)});
 if(!gl.length){msg('No duplicates found.');return}
 msg(gl.length+' duplicate group(s). The largest copy of each is kept. '+dupExtra.length+' extra copies will be deleted.');$('dupgo').style.display='';$('dupgo').textContent='Delete '+dupExtra.length+' extra copies'};
$('dupgo').onclick=async()=>{if(!dupExtra.length)return;if(!confirm('Delete '+dupExtra.length+' duplicate copies for good?'))return;$('dupgo').disabled=true;const r=await removeTiles(dupExtra,msg);$('dupgo').disabled=false;$('dupgo').style.display='none';$('dupl').innerHTML='';dupExtra=[];if(r.ok)msg(r.failed?'Duplicates removed. '+r.failed+' file(s) could not be deleted from the repo but are not shown.':'Duplicates removed.')};
})();
