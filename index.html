<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Em Em</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Georgia,'Times New Roman',serif;color:#fff;background:#0d0d10;overflow-x:hidden}
#bg{position:fixed;inset:0;background:#0d0d10 center/cover no-repeat;z-index:-2;transition:opacity 1.2s}
#bg:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0,#ff7aa822,transparent 60%)}
.h{position:fixed;color:#ff7aa8;opacity:0;pointer-events:none;z-index:-1;animation:f linear infinite}
@keyframes f{0%{transform:translateY(0) scale(.8);opacity:0}15%{opacity:.5}100%{transform:translateY(-110vh) scale(1.2);opacity:0}}
#lock{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10;background:#0d0d10;transition:opacity .8s}
#lock.off{opacity:0;pointer-events:none}
#lock h1{font-weight:normal;font-size:34px;letter-spacing:2px}
#pw{padding:13px 22px;border-radius:30px;border:1px solid #fff4;background:#ffffff1f;color:#fff;font-size:18px;text-align:center;width:260px;outline:none}
#go{padding:11px 30px;border-radius:30px;border:0;background:#ff7aa8;color:#1a0f1a;font-size:16px;cursor:pointer}
#msg{font-size:14px;opacity:.7;min-height:18px}
#app{display:none;padding:env(safe-area-inset-top) 0 40px}
.t{text-align:center;padding:34px 0 6px;font-size:34px;letter-spacing:2px;text-shadow:0 2px 20px #000}
.s{text-align:center;opacity:.7;font-size:15px;margin-bottom:18px}
.g{columns:2;column-gap:12px;padding:0 14px;max-width:1200px;margin:auto}
@media(min-width:700px){.g{columns:3}}@media(min-width:1000px){.g{columns:4}}
.c{break-inside:avoid;margin-bottom:12px;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #0009,0 0 0 1px #ffffff22;transform:rotate(var(--r)) scale(.92);opacity:0;animation:in .7s forwards;animation-delay:var(--d);cursor:pointer;transition:transform .3s,box-shadow .3s}
.c:hover{transform:rotate(0) scale(1.03);box-shadow:0 12px 34px #0009,0 0 30px #ff7aa866}
.c img{width:100%;display:block}
@keyframes in{to{opacity:1;transform:rotate(var(--r)) scale(1)}}
#lb{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:20}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:16px;box-shadow:0 0 80px #ff7aa877,0 20px 60px #000;animation:z .35s}
@keyframes z{from{transform:scale(.9);opacity:0}}
.n{position:absolute;top:50%;font-size:54px;opacity:.7;padding:10px 18px;cursor:pointer;user-select:none;transform:translateY(-50%)}
#x{position:absolute;top:14px;right:20px;font-size:34px;cursor:pointer;padding:6px}
#ct{position:absolute;bottom:16px;font-size:14px;opacity:.7}
</style></head><body>
<div id="bg"></div>
<div id="lock"><h1>Em Em ❤️‍🩹</h1><input id="pw" type="password" placeholder="password" autocomplete="off"><button id="go">Open</button><div id="msg"></div></div>
<div id="app"><div class="t">Em Em ❤️‍🩹</div><div class="s">tap a photo to open it</div><div class="g" id="g"></div></div>
<div id="lb"><div id="x">✕</div><div class="n" style="left:4px" id="pv">‹</div><img id="big"><div class="n" style="right:4px" id="nx">›</div><div id="ct"></div></div>
<script>
const D={"salt":"NcxAo0eQhw0kwoLsdwE4MA==","it":250000,"check":{"iv":"Aar//vK3q6WF0DrK","d":"T8Vpxldo1IaGB68sVrWI5iNV6bdbRARZ"},"n":61};
const gj=async n=>(await fetch('d-'+n+'.json')).json();
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.salt),iterations:D.it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])}
async function dec(k,o){const iv=b64(o.iv);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},k,b64(o.d)))}
let urls=[],cur=0;
for(let i=0;i<22;i++){const e=document.createElement('div');e.className='h';e.textContent='♥';e.style.left=(i*37%100)+'%';e.style.top=(60+i*13%50)+'%';e.style.fontSize=(14+i%4*8)+'px';e.style.animationDuration=(9+i%5*3)+'s';e.style.animationDelay=(-i*1.3)+'s';document.body.appendChild(e)}
async function open_(){
 const pw=document.getElementById('pw').value,m=document.getElementById('msg');m.textContent='...';
 try{const k=await key(pw);const chk=await dec(k,D.check);if(new TextDecoder().decode(chk)!=='em-em-ok')throw 0;
  const bg=await dec(k,await gj('bg'));document.getElementById('bg').style.backgroundImage='url('+URL.createObjectURL(new Blob([bg],{type:'image/jpeg'}))+')';
  const g=document.getElementById('g');
  for(let i=0;i<D.n;i++){const u=URL.createObjectURL(new Blob([await dec(k,await gj(String(i)))],{type:'image/jpeg'}));urls.push(u);
   const c=document.createElement('div');c.className='c';c.style.setProperty('--r',((i%5-2)*0.8)+'deg');c.style.setProperty('--d',(i*0.12)+'s');c.innerHTML='<img>';c.firstChild.src=u;c.onclick=()=>show(i);g.appendChild(c)}
  document.getElementById('lock').classList.add('off');document.getElementById('app').style.display='block';
 }catch(e){m.textContent='wrong password'}}
function show(i){cur=(i+urls.length)%urls.length;lb.classList.add('on');big.src=urls[cur];ct.textContent=(cur+1)+' / '+urls.length}
const lb=document.getElementById('lb'),big=document.getElementById('big'),ct=document.getElementById('ct');
x.onclick=()=>lb.classList.remove('on');pv.onclick=e=>{e.stopPropagation();show(cur-1)};nx.onclick=e=>{e.stopPropagation();show(cur+1)};
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('on')};
document.addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
let sx=0;lb.addEventListener('touchstart',e=>sx=e.touches[0].clientX);lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)show(cur+(d<0?1:-1))});
go.onclick=open_;pw.addEventListener('keydown',e=>{if(e.key==='Enter')open_()});
</script></body></html>
